# Spring
server.port=8080
spring.main.banner-mode=off
spring.output.ansi.enabled=always

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query-timeout=2
spring.datasource.tomcat.validation-query=SELECT 1
spring.jpa.open-in-view=false
spring.flyway.connect-retries=100
spring.flyway.connect-retries-interval=10s
spring.sql.init.continue-on-error=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
#spring.datasource.hikari.maximum-pool-size=150
#spring.jpa.show-sql=true

# Swagger
springdoc.swagger-ui.use-root-path=true

# Logging
logging.level.com.schambeck.marketplace.template=debug

# Custom
custom.frontend-url=http://localhost:4200
custom.cors.allowed-origins=${custom.frontend-url}

# Security
okta.oauth2.issuer=https://dev-lug9ug4n.us.auth0.com/
okta.oauth2.audience=api-marketplace-id

# Mercado Pago
mercado-pago.access-token=
mercado-pago.feedback-url=${custom.frontend-url}/payment

# Google Cloud Storage
object-storage.gcs.enabled=false
object-storage.gcs.project-id=
object-storage.gcs.bucket-name=

# Minio
object-storage.minio.enabled=true
object-storage.minio.access-key=
object-storage.minio.secret-key=
object-storage.minio.bucket-name=marketplace
object-storage.minio.endpoint=localhost
object-storage.minio.port=9010
object-storage.minio.secure=false
