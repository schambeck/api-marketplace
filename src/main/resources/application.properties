# Spring
server.port=8080
spring.main.banner-mode=off
spring.output.ansi.enabled=always

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query-timeout=2
spring.datasource.tomcat.validation-query=SELECT 1
spring.jpa.open-in-view=false
spring.flyway.connect-retries=100
spring.flyway.connect-retries-interval=10s
spring.sql.init.continue-on-error=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
#spring.datasource.hikari.maximum-pool-size=150
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.highlight_sql=true
#spring.main.lazy-initialization=true

# Swagger
springdoc.swagger-ui.use-root-path=true

# Logging
logging.level.com.schambeck.marketplace.template=debug
logging.pattern.dateformat=HH:mm:ss.SSS
#logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# Custom
custom.frontend-url=http://localhost:4200
custom.cors.allowed-origins=${custom.frontend-url}

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_URI:http://keycloak.localhost:9000/realms/marketplace}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# Mercado Pago
mercado-pago.access-token=APP_USR-6414234097099226-031322-9babc62675f483ff2abcbe431bb7c975-98822096
mercado-pago.feedback-url=${custom.frontend-url}/payment

# Google Cloud Storage
object-storage.gcs.enabled=true
object-storage.gcs.project-id=
object-storage.gcs.bucket-name=
object-storage.gcs.credentials-file=/credentials.json

# Minio
object-storage.minio.enabled=false
object-storage.minio.access-key=
object-storage.minio.secret-key=
object-storage.minio.bucket-name=marketplace
object-storage.minio.endpoint=localhost
object-storage.minio.port=9010
object-storage.minio.secure=false

# SSL
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:cert/marketplace.p12
server.ssl.key-store-password=
server.ssl.key-alias=marketplace
server.ssl.enabled=false
