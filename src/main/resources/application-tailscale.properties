# Spring
server.port=8443
spring.main.banner-mode=off
spring.output.ansi.enabled=always

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query-timeout=2
spring.datasource.tomcat.validation-query=SELECT 1
spring.jpa.open-in-view=false
spring.flyway.connect-retries=100
spring.flyway.connect-retries-interval=10s
spring.sql.init.continue-on-error=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
#spring.datasource.hikari.maximum-pool-size=150
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.highlight_sql=true
#spring.main.lazy-initialization=true

# Swagger
springdoc.swagger-ui.use-root-path=true

# Logging
logging.level.com.schambeck.marketplace.template=debug
logging.pattern.dateformat=HH:mm:ss.SSS
#logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# Custom
custom.frontend-url=https://thing.taildf99e0.ts.net
custom.cors.allowed-origins=${custom.frontend-url},http://localhost:4200,https://auth.mercadopago.com.br,https://webhook.site

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_URI:https://thing.taildf99e0.ts.net:9443/realms/marketplace}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

