# Google Cloud Storage
object-storage.gcs.enabled=true
object-storage.gcs.project-id=prj-marketplace
object-storage.gcs.bucket-name=bkt-marketplace
object-storage.gcs.credentials-file=/credentials.json

# S3-compatible object storage
object-storage.s3.enabled=${OBJECT_STORAGE_S3_ENABLED:true}
object-storage.s3.access-key=${OBJECT_STORAGE_S3_ACCESS_KEY:}
object-storage.s3.secret-key=${OBJECT_STORAGE_S3_SECRET_KEY:}
object-storage.s3.bucket-name=${OBJECT_STORAGE_S3_BUCKET_NAME:marketplace}
object-storage.s3.endpoint=${OBJECT_STORAGE_S3_ENDPOINT:http://localhost:9010}
object-storage.s3.region=${OBJECT_STORAGE_S3_REGION:us-east-1}
object-storage.s3.path-style-access=${OBJECT_STORAGE_S3_PATH_STYLE_ACCESS:true}
object-storage.s3.secure=${OBJECT_STORAGE_S3_SECURE:false}

# SSL
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore-tailscale.p12
server.ssl.key-store-password=marketplace
server.ssl.key-alias=thing.taildf99e0.ts.net
