services:
  web:
    image: ${WEB_IMAGE:-api-marketplace:latest}
    restart: always
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/marketplace}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      CUSTOM_FRONTEND_URL: ${CUSTOM_FRONTEND_URL:-http://localhost:4200}
      CUSTOM_CORS_ALLOWED_ORIGINS: ${CUSTOM_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_URI: ${AUTH_URI:-http://localhost:9000/realms/marketplace}
      MERCADO_PAGO_REDIRECT_URI: ${MERCADO_PAGO_REDIRECT_URI:-http://localhost:8080/oauth}
      MERCADO_PAGO_ACCESS_TOKEN: TEST-140cca7a-e54a-4129-b8ad-946944c0a8cd
      OBJECT_STORAGE_GCS_PROJECT_ID: ${OBJECT_STORAGE_GCS_PROJECT_ID:-prj-marketplace}
      OBJECT_STORAGE_GCS_BUCKET_NAME: ${OBJECT_STORAGE_GCS_BUCKET_NAME:-bkt-marketplace}
    ports:
        - '${SERVER_PORT:-8080}:${SERVER_PORT:-8080}'
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
  postgres:
    image: postgres:17.3-alpine
    restart: always
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - local
    command:
      - start-dev
      - --import-realm
    environment:
      KC_HTTP_PORT: 9000
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9000:9000'
  keycloak-production:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - production
    command:
      - start
      - --import-realm
      - --hostname=gamebazaar.duckdns.org
      - --https-certificate-file=/opt/keycloak/conf/cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/privkey.pem
    environment:
      KC_HTTPS_PORT: 9443
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./certbot/cert.pem:/opt/keycloak/conf/cert.pem
      - ./certbot/privkey.pem:/opt/keycloak/conf/privkey.pem
      - ./realm-dev.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9443:9443'
  keycloak-tailscale:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - tailscale
    command:
      - start
      - --import-realm
      - --hostname=thing.taildf99e0.ts.net
      - --https-certificate-file=/opt/keycloak/conf/cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/privkey.pem
    environment:
      KC_HTTPS_PORT: 9443
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./certbot-tailscale/thing.crt:/opt/keycloak/conf/cert.pem
      - ./certbot-tailscale/thing.key:/opt/keycloak/conf/privkey.pem
      - ./realm-dev.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9443:9443'
  minio-server:
    image: quay.io/minio/minio
    restart: always
    hostname: minio.localhost
    command: server /data --console-address ":9001"
    volumes:
      - 'minio_data:/data'
    ports:
      - '9010:9000'
      - '9011:9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
  minio-client:
    image: minio/mc
    depends_on:
      - minio-server
    volumes:
      - './minio:/tmp/minio-pictures'
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio-server:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/${MINIO_BUCKET};
      /usr/bin/mc cp --recursive /tmp/minio-pictures/* myminio/${MINIO_BUCKET};
      exit 0;
      "
volumes:
  minio_data:
