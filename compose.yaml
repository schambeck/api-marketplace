services:
  web:
    image: api-marketplace:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/marketplace
      - AUTH_URI=http://keycloak.localhost:9000/realms/marketplace
    ports:
      - '8080:8080'
  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
  keycloak:
    image: kc-marketplace:latest
    restart: always
    hostname: keycloak.localhost
    command:
      - start-dev
      - --import-realm
    environment:
      - KC_HTTP_PORT=9000
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - REALM_NAME=marketplace
    ports:
      - '9000:9000'
