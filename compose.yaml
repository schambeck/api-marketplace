services:
  web:
    image: ${WEB_IMAGE:-api-marketplace:latest}
    restart: always
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/marketplace}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      CUSTOM_FRONTEND_URL: ${CUSTOM_FRONTEND_URL:-http://localhost:4200}
      CUSTOM_CORS_ALLOWED_ORIGINS: ${CUSTOM_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_URI: ${AUTH_URI:-http://localhost:9000/realms/marketplace}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:9000}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-marketplace}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      MERCADO_PAGO_REDIRECT_URI: ${MERCADO_PAGO_REDIRECT_URI:-http://localhost:8080/oauth}
      MERCADO_PAGO_ACCESS_TOKEN: TEST-140cca7a-e54a-4129-b8ad-946944c0a8cd
      OBJECT_STORAGE_GCS_PROJECT_ID: ${OBJECT_STORAGE_GCS_PROJECT_ID:-prj-marketplace}
      OBJECT_STORAGE_GCS_BUCKET_NAME: ${OBJECT_STORAGE_GCS_BUCKET_NAME:-bkt-marketplace}
      OBJECT_STORAGE_S3_ENABLED: ${OBJECT_STORAGE_S3_ENABLED:-true}
      OBJECT_STORAGE_S3_ENDPOINT: ${OBJECT_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      OBJECT_STORAGE_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER}}
      OBJECT_STORAGE_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      OBJECT_STORAGE_S3_BUCKET_NAME: ${RUSTFS_BUCKET:-marketplace}
      OBJECT_STORAGE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
    ports:
        - '${SERVER_PORT:-8080}:${SERVER_PORT:-8080}'
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
  postgres:
    image: postgres:17.3-alpine
    restart: always
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - local
    command:
      - start-dev
      - --import-realm
    environment:
      KC_HTTP_PORT: 9000
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9000:9000'
  keycloak-production:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - production
    command:
      - start
      - --import-realm
      - --hostname=gamebazaar.duckdns.org
      - --https-certificate-file=/opt/keycloak/conf/cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/privkey.pem
    environment:
      KC_HTTPS_PORT: 9443
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./certbot/cert.pem:/opt/keycloak/conf/cert.pem
      - ./certbot/privkey.pem:/opt/keycloak/conf/privkey.pem
      - ./realm-dev.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9443:9443'
  keycloak-tailscale:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    profiles:
      - tailscale
    command:
      - start
      - --import-realm
      - --hostname=thing.taildf99e0.ts.net
      - --https-certificate-file=/opt/keycloak/conf/cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/privkey.pem
    environment:
      KC_HTTPS_PORT: 9443
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REALM_NAME: marketplace
    volumes:
      - ./certbot-tailscale/thing.crt:/opt/keycloak/conf/cert.pem
      - ./certbot-tailscale/thing.key:/opt/keycloak/conf/privkey.pem
      - ./realm-dev.json:/opt/keycloak/data/import/realm.json
    ports:
      - '9443:9443'
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: always
    hostname: rustfs.localhost
    command: server /data
    volumes:
      - 'rustfs_data:/data'
    ports:
      - '9010:9000'
      - '9011:9001'
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER}}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
  rustfs-init:
    image: amazon/aws-cli:2.27.41
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${RUSTFS_BUCKET:-marketplace} >/dev/null 2>&1; do
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ${RUSTFS_BUCKET:-marketplace} >/dev/null 2>&1 || true;
        sleep 2;
      done;
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER}}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      AWS_DEFAULT_REGION: ${RUSTFS_REGION:-us-east-1}
volumes:
  rustfs_data:
