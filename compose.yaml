services:
  web:
    image: api-marketplace:latest
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CUSTOM_CORS_ALLOWED_ORIGINS: https://${EXTERNAL_IP}
      AUTH_URI: http://keycloak.localhost:9000/realms/marketplace
      MERCADO_PAGO_ACCESS_TOKEN: APP_USR-6414234097099226-031322-9babc62675f483ff2abcbe431bb7c975-98822096
      OBJECT_STORAGE_GCS_PROJECT_ID: prj-marketplace
      OBJECT_STORAGE_GCS_BUCKET_NAME: bkt-marketplace
      SERVER_PORT: 8081
#    ports:
#      - '8443:8443'
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./zerossl/marketplace:/etc/nginx/cert
