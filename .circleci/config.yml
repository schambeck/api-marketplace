version: 2.1

jobs:
  maven-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
      - run:
          name: Run Maven verification
          command: ./mvnw clean verify

workflows:
  maven-pipeline:
    jobs:
      - maven-test
